# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
# Desabilitado: incompatível com dsh 0.2.2-rc.1 (settingsNamespace removido)
# Desabilitado: cria ciclo de dependência com plugin-market
- id: kilo2dsh
  disabled: true
- id: dsh-at-file
  disabled: true
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: nvidia-nim-tor
    model: mistralai/mistral-large-4-1t-a52b
    reasoningEffort: high
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    selectedDefault: cordis
# dsh-ssh 0.4.3 takeover global: a linha-agregado ssh-remote registra "fs"
# como SshFileSystem (expulsa fs-sandbox) e rota TODO caminho local pela
# conexao placeholder (127.0.0.1, user "ssh") -> toda sessao falha em
# "cannot resolve ... All configured authentication methods failed" antes
# de chegar ao LLM. Desativada ate o desenho remoto correto (perfil
# dedicado com conexao real). Reversao: apagar este bloco.
- id: ssh-remote
  disabled: true
- id: directory-picker-ssh
  disabled: true
# devolve o picker de diretorio ao auto nativo (dsh-ssh tinha-o desativado)
- id: directory-picker
  name: "@deepseek-ai/dsh-host-directory-picker-auto"
  disabled: false
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: dark
- id: llm-newapi
  name: dsh-gateway-provider
  disabled: true
  config:
    models: []

