name: CI

on:
  push:
    branches: [main, fase-0]
  pull_request:
    branches: [main, fase-0]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Instalar dependências a partir do lock (com hashes)
        run: |
          python -m pip install --upgrade pip ruff
          pip install --require-hashes -r requirements.lock

      - name: Bloquear arquivos de backup versionados
        run: |
          if git ls-files | grep -E '\.(bak|orig)$'; then
            echo "::error::Arquivos .bak/.orig nao devem ser versionados"
            exit 1
          fi

      - name: Executar ruff
        run: ruff check src tests

      - name: Executar testes (excluindo GPU)
        run: PYTHONPATH=src python -m pytest -q -m "not gpu" tests

  lock-fresh:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verificar se o lock acompanha o requirements.in (informativo)
        run: |
          python -m pip install --upgrade pip pip-tools
          pip-compile --generate-hashes --quiet requirements.in -o /tmp/lock.new
          diff <(grep -v '^#' requirements.lock) <(grep -v '^#' /tmp/lock.new) || echo "::warning::requirements.lock difere do recompilado"
        shell: bash
