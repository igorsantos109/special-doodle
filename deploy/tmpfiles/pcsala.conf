# /run/pcsala — diretorio dos locks de troca de GPU do pc-sala-agent
#
# A CLI `pcsala models switch|start|stop` corre como o utilizador igor e
# cria aqui o lock `pcsala-gpu-switch.lock` (ver PCSALA_LOCK_DIR /
# GPU_SWITCH_LOCK_DIR em src/pcsala_agent/model_manager.py).
#
# /run e' root:root, por isso o diretorio tem de ser criado no arranque
# com a propriedade do utilizador que corre a CLI. Sem isto, o switch
# falha com PermissionError: '/run/pcsala'.
#
# INSTALACAO:
#   sudo install -D -o root -g root -m 0644 deploy/tmpfiles/pcsala.conf \
#       /etc/tmpfiles.d/pcsala.conf
#   sudo systemd-tmpfiles --create /etc/tmpfiles.d/pcsala.conf
d /run/pcsala 0755 igor igor -
