[project]
name = "pc-sala-agent"
version = "1.0.0"
description = "PC-SALA Agent - Hybrid agentic programming prototype (handoff 1.0)"
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "pydantic",
    "pytest",
    "PyYAML",
]

[project.optional-dependencies]
dev = [
    "ruff",
]

[project.scripts]
pcsala = "pcsala_agent.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "gpu: testes que exigem GPU real ou llama-swap (excluídos da CI)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "BLE", "SIM", "PLW", "I", "RUF"]
ignore = []

[tool.ruff.isort]
known-first-party = ["pcsala_agent"]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "PLC"]
